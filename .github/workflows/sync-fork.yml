name: Sync to Organization via SSH

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORG_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      
      - name: Configure Git
        run: |
          git config --global user.name "Shega-PT"
          git config --global user.email "seu-email@exemplo.com"
      
      - name: Push via SSH
        run: |
          git remote add org git@github.com:AERUS-TELLUS/AERUS.git
          git push org --all --force
          git push org --tags --force