name: Sync to Organization

on:
  push:
    branches: [ main ]  # ou 'master', se for o caso
  workflow_dispatch:    # permite execução manual

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.ORG_TOKEN }}  # <-- LINHA CRUCIAL ADICIONADA
      
      - name: Sync to Organization
        run: |
          git remote add org https://Shega-PT:${{ secrets.ORG_TOKEN }}@github.com/AERUS-TELLUS/AERUS.git
          git push org --all --force
          git push org --tags --force
        env:
          GITHUB_TOKEN: ${{ secrets.ORG_TOKEN }}