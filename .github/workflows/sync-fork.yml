name: Sync to Organization

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # PASSO 1: Checkout com token explícito
      - name: Checkout repository
        uses: actions/checkout@v4  # ← ATUALIZEI PARA V4
        with:
          fetch-depth: 0
          token: ${{ secrets.ORG_TOKEN }}
      
      # PASSO 2: Configurar Git com suas credenciais
      - name: Configure Git
        run: |
          git config --global user.name "Shega-PT"
          git config --global user.email "seu-email@exemplo.com"
          git config --global http.postBuffer 524288000
      
      # PASSO 3: Sincronizar para organização
      - name: Push to Organization
        run: |
          git remote add org https://Shega-PT:${{ secrets.ORG_TOKEN }}@github.com/AERUS-TELLUS/AERUS.git
          git push org --all --force --verbose
          git push org --tags --force --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.ORG_TOKEN }}